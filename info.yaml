# Tiny Tapeout project information
project:
  title:        "CNN IM2COL accelerator"      # Project title
  author:       "Team 2"      # Your name
  discord:      "LazyTreeBranch"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "IM2COL processing on an 8x8 input img matrix"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     0       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "2x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_cnn_accel"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "tt_um_cnn_accel.sv"
    - "system_params.sv"
    - "out_controller.sv"
    - "mmm_sequencer.sv"
    - "memory.sv"
    - "mac_unit.sv"
    - "im2col.sv"
    - "fsm.sv"
    - "cnn_accelerator.sv"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "DATA_0"
  ui[1]: "DATA_1"
  ui[2]: "DATA_2"
  ui[3]: "DATA_3"
  ui[4]: "DATA_4"
  ui[5]: "DATA_5"
  ui[6]: "DATA_6"
  ui[7]: "DATA_7"

  # Outputs
  uo[0]: "CNN_OUT_0"
  uo[1]: "CNN_OUT_1"
  uo[2]: "CNN_OUT_2"
  uo[3]: "CNN_OUT_3"
  uo[4]: "CNN_OUT_4"
  uo[5]: "CNN_OUT_5"
  uo[6]: "BUSY"
  uo[7]: "DONE"

  # Bidirectional pins
  uio[0]: "EXT_CLK"
  uio[1]: "OUTPUT_EN"
  uio[2]: "START"
  uio[3]: "IMAGE_WE"
  uio[4]: "WEIGHT_WE"
  uio[5]: "UNUSED"
  uio[6]: "UNUSED"
  uio[7]: "UNUSED"
  
yaml_version: 6
